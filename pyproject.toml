[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "urbaneq"
version = "0.1.0"
description = "Educational urban-economics identities: bid-rent, open versus closed city, Roback cells, housing-supply incidence."
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Dr. Pavanam Thomas", email = "thomaspavanam@gmail.com" },
]
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Intended Audience :: Science/Research",
    "Topic :: Office/Business :: Financial",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.urls]
Homepage = "https://github.com/pavanamthomas/urban-economics-spatial-equilibrium-lab"
Repository = "https://github.com/pavanamthomas/urban-economics-spatial-equilibrium-lab"

[project.scripts]
urbaneq-flagship = "urbaneq.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
